server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /codebadger {
        return 308 /codebadger/;
    }

    location ^~ /codebadger/_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /codebadger/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}

name: Deploy CodeBadger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-codebadger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      DEPLOY_PATH: ~/projects/CodeBadger/dist

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Astro checks
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/codebadger_deploy_key
          chmod 600 ~/.ssh/codebadger_deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Ensure remote deploy directory exists
        run: ssh -i ~/.ssh/codebadger_deploy_key "$SERVER_USER@$SERVER_HOST" "mkdir -p $DEPLOY_PATH"

      - name: Sync built files to server
        run: rsync -az --delete -e "ssh -i ~/.ssh/codebadger_deploy_key" dist/ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"
